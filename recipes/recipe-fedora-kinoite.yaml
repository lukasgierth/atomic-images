---
name: tipsy-tippete
description: Image based on ublue Kinoite

base-image: ghcr.io/ublue-os/kinoite-main
image-version: 45

modules:
  - type: dnf
    install:
      packages:
        - dolphin-plugins
        - flatpak-kcm
        - kio-fuse
        - spectacle
    remove:
      packages:
        - cosign # will be replaced by my version
        - filelight
        - firewall-config
        - kcharselect
        - khelpcenter
        - kjournald
        - kwrite
        - plasma-discover
        - plasma-emojier
        - plasma-welcome

  - from-file: shared-desktop.yaml
  - from-file: modules/flatpaks-kde.yaml

  - type: script
    scripts:
      - prefer-bootc-over-rpm-ostree.sh
      - disable-layering.sh

  - type: os-release
    properties:
      ID: fedora
      ID_LIKE: fedora
      NAME: Tipsy Tippete 45
      PRETTY_NAME: Tipsy Tippete 45
      VARIANT: Tipsy Tippete
      VARIANT_ID: tipsy-tippete
      DEFAULT_HOSTNAME: tipsy-tippete

  - type: initramfs
  - type: signing
